<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safoora Dresses — Contemporary & Heritage Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf7f2;
      --surface: #ffffff;
      --surface-alt: #f1ebe2;
      --text: #1c1917;
      --muted: #6b625b;
      --accent: #7c2d12;
      --accent-hover: #5c1f0b;
      --border: #e5ddd2;
      --radius: 12px;
      --shadow: 0 12px 32px rgba(28, 25, 23, 0.06);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    h1, h2, h3, .brand-logo {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      line-height: 1.15;
    }

    .container { width: min(1140px, 92%); margin-inline: auto; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0);
    }

    .muted { color: var(--muted); }

    .site-header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(250, 247, 242, 0.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex; align-items: center; justify-content: space-between; height: 72px;
    }

    .brand-logo {
      text-decoration: none; color: var(--text); font-size: 1.5rem; letter-spacing: 0.08em;
      display: inline-flex; align-items: baseline; gap: 0.35rem;
    }

    .brand-logo span {
      font-family: "Plus Jakarta Sans", sans-serif; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.2em; color: var(--accent);
    }

    .nav-links { display: flex; gap: 2rem; }
    .nav-links a {
      text-decoration: none; color: var(--text); font-size: 0.92rem; font-weight: 500; transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }

    .cart-btn {
      display: inline-flex; align-items: center; gap: 0.55rem; background: var(--text); color: #fff;
      border: none; padding: 0.55rem 1rem; border-radius: 999px; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .cart-btn:hover { background: var(--accent); }

    .cart-count {
      background: #fff; color: var(--text); font-size: 0.75rem; font-weight: 700;
      min-width: 20px; height: 20px; border-radius: 999px; display: inline-grid; place-items: center; padding-inline: 5px;
    }

    .hero { padding: 4.5rem 0 3.5rem; }
    .hero-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 2.5rem; align-items: center; }
    .eyebrow {
      text-transform: uppercase; letter-spacing: 0.16em; font-size: 0.75rem; font-weight: 700;
      color: var(--accent); margin-bottom: 0.65rem;
    }
    .hero h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); margin-bottom: 1rem; }
    .hero-desc { color: var(--muted); max-width: 52ch; margin-bottom: 1.75rem; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 0.85rem; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; border-radius: 999px;
      padding: 0.78rem 1.5rem; font-size: 0.9rem; font-weight: 600; text-decoration: none;
      border: 1px solid transparent; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { border-color: var(--border); color: var(--text); background: transparent; }
    .btn-ghost:hover { border-color: var(--text); }
    .full-width { width: 100%; }

    .hero-visual {
      min-height: 360px; border-radius: 20px;
      background:
        radial-gradient(circle at 25% 20%, rgba(255, 255, 255, 0.28), transparent 55%),
        linear-gradient(145deg, #7c2d12 0%, #3f1d14 60%, #1c1917 100%);
      padding: 1.75rem; display: flex; align-items: flex-end; box-shadow: var(--shadow);
    }

    .hero-card {
      width: 100%; background: rgba(255, 255, 255, 0.94); color: var(--text);
      padding: 1.15rem 1.3rem; border-radius: var(--radius);
    }
    .badge {
      display: inline-block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.25rem;
    }
    .card-title { font-family: "Cormorant Garamond", serif; font-size: 1.35rem; font-weight: 700; }
    .card-meta { font-size: 0.82rem; color: var(--muted); }

    .section { padding: 4rem 0; }
    .section-header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end;
      gap: 1.25rem; margin-bottom: 2rem;
    }
    .section-header h2 { font-size: clamp(2rem, 3.5vw, 2.75rem); }

    .filter-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .filter-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 0.5rem 1rem; border-radius: 999px; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--text); color: #fff; border-color: var(--text);
    }

    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem;
    }
    .product-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow);
    }
    .product-swatch {
      height: 220px; padding: 1rem; display: flex; align-items: flex-start; justify-content: space-between;
    }
    .tag {
      background: rgba(255, 255, 255, 0.9); color: var(--text); font-size: 0.72rem;
      font-weight: 600; padding: 0.28rem 0.65rem; border-radius: 999px;
    }
    .product-body { padding: 1.15rem; display: flex; flex-direction: column; gap: 0.75rem; flex: 1; }
    .product-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
    .product-name { font-size: 1.35rem; }
    .product-price { font-weight: 700; font-size: 0.95rem; }

    .size-row { display: flex; gap: 0.4rem; }
    .size-pill {
      border: 1px solid var(--border); background: transparent; padding: 0.25rem 0.6rem;
      border-radius: 6px; font-size: 0.76rem; font-weight: 600; cursor: pointer;
    }
    .size-pill.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
    .product-body .btn { margin-top: auto; }

    .story-band { background: var(--surface-alt); border-block: 1px solid var(--border); }
    .story-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 2.5rem; align-items: start; }
    .story-band h2 { font-size: clamp(2rem, 3.5vw, 2.6rem); }
    .story-points p { color: var(--muted); margin-bottom: 1.5rem; }
    .stats-row { display: flex; gap: 2.5rem; }
    .stats-row strong {
      display: block; font-family: "Cormorant Garamond", serif; font-size: 2rem; color: var(--accent);
    }
    .stats-row span { font-size: 0.85rem; color: var(--muted); }

    .newsletter-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 2.25rem; display: grid; gap: 1.25rem; box-shadow: var(--shadow);
    }
    .newsletter-form { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .newsletter-form input {
      flex: 1 1 240px; padding: 0.78rem 1rem; border-radius: 999px;
      border: 1px solid var(--border); font-size: 0.92rem; font-family: inherit;
    }
    .form-status, .checkout-note { font-size: 0.88rem; color: var(--accent); font-weight: 500; }

    .site-footer { border-top: 1px solid var(--border); padding: 1.75rem 0; }
    .footer-inner {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;
    }

    .drawer-backdrop { position: fixed; inset: 0; background: rgba(28, 25, 23, 0.45); z-index: 40; }
    .cart-drawer {
      position: fixed; top: 0; right: 0; width: min(400px, 100vw); height: 100dvh;
      background: var(--surface); z-index: 50; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform 0.28s ease; box-shadow: -12px 0 36px rgba(0, 0, 0, 0.12);
    }
    .cart-drawer.open { transform: translateX(0); }

    .drawer-header, .drawer-footer { padding: 1.25rem; border-bottom: 1px solid var(--border); }
    .drawer-footer {
      border-bottom: none; border-top: 1px solid var(--border); display: grid; gap: 0.75rem;
    }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; }

    .icon-btn {
      background: transparent; border: 1px solid var(--border); width: 34px; height: 34px;
      border-radius: 50%; cursor: pointer; font-size: 0.95rem;
    }

    .drawer-body {
      flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem;
    }

    .cart-item {
      display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
      padding-bottom: 0.9rem; border-bottom: 1px solid var(--border);
    }
    .qty-controls { display: inline-flex; align-items: center; gap: 0.45rem; }
    .qty-btn {
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); cursor: pointer; font-weight: 700;
    }
    .subtotal-row { display: flex; justify-content: space-between; font-size: 1.05rem; }

    @media (max-width: 820px) {
      .hero-grid, .story-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="brand-logo">SAFOORA<span>DRESSES</span></a>
      <nav class="nav-links" aria-label="Main Navigation">
        <a href="#collections">Collections</a>
        <a href="#story">Our Craft</a>
        <a href="#newsletter">Journal</a>
      </nav>
      <button class="cart-btn" id="openCartBtn" aria-label="Open shopping bag">
        <span>Bag</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="eyebrow">Autumn / Winter Edit</p>
          <h1>Timeless silhouettes crafted in breathable fabrics.</h1>
          <p class="hero-desc">
            Safoora Dresses blends understated tailoring with rich textures—designed for effortless day-to-evening elegance.
          </p>
          <div class="hero-actions">
            <a href="#collections" class="btn btn-primary">Explore Collection</a>
            <a href="#story" class="btn btn-ghost">Discover Craft</a>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true">
